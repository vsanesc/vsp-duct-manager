repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: local
    hooks:
      - id: check-private-values
        name: block values from the private duct_config.yaml
        entry: python scripts/check_private_values.py
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        always_run: true
