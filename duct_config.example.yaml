# VSP Duct Manager - example configuration with generic dummy values.
# Copy to duct_config.yaml (gitignored) and edit; that file is used in preference to this one.
# Units: metres, seconds, kg, K, Pa.  VSP axes: +X aft, +Y right, +Z up.
# All numbers below are placeholders, not a validated design.

model:
  vsp3_path: example_model.vsp3    # input model; never overwritten (output: <name>_ducts.vsp3)
                                   # create the dummy model with: python make_example_model.py
  fuselage_name: Test Fuselage     # name of the fuselage Geom in the model
  duct_prefix: DUCT_               # only Geoms with this prefix are ever touched

# ---- Phase 1: engine and area sizing ------------------------------------
engine:
  geom_name: Test Engine           # Geom in the model: its front (min-x) end centre is the face centre,
                                   # its bounding box is the engine envelope (casing)
  face_diameter: 0.5               # m, the fan / engine face (NOT the casing)
  face_to_envelope_range: [0.80, 0.98]   # expected face diameter / Geom bounding-box (casing) diameter; outside -> WARN
  hub_to_tip_ratio: 0.0            # 0 = full disc
  corrected_flow_per_area: 190.0   # kg/s/m^2 (corrected flow per unit face area)
  reference_thrust: 10000.0        # N, optional (sanity check)
  reference_thrust_condition:      # where reference_thrust is rated (default: sea-level static)
    mach: 0.0
    altitude: 0.0                  # m
  specific_thrust_range: [200.0, 600.0]   # [min, max] N/(kg/s), optional (sanity check)
  face_mach_range: [0.3, 0.7]      # expected engine-face Mach band; outside it -> WARN

design_point:
  mach: 0.6
  altitude: 5000.0                 # m
  pressure_recovery: 0.97          # total-pressure recovery eta
  capture_margin: 1.05

# ---- Phase 2: duct geometry ---------------------------------------------
ducts:
  n_inlets: 2                      # capture area per inlet = total / n_inlets
  inlet:                           # right inlet; the left one is its mirror image about XZ
    origin: [2.0, 0.5, 1.371]      # [x, y, z] origin O of the inlet plane (on / near the skin)
    pitch_deg: 0.0                 # rotation about Y: opening tilted up (+) / down (-)
    sweep_deg: 0.0                 # rotation about Z: opening swept in planform; plane normal
                                   # n = Rz(sweep) Ry(pitch) (-X), so 0 / 0 is the plane x = const facing forward
  key_sections:                    # sections along each branch (right inlet; the left one is its mirror image)
    - s: 0.0                       # normalised arc length: 0 = the inlet section, in the inlet plane
      vertices:                    # [u, v] in metres relative to O (u right, v up seen from the front; counter-clockwise)
        - [-0.09242, -0.07479]
        - [0.14268, 0.04234]
        - [0.13367, 0.31868]
        - [-0.00203, 0.40010]
        - [-0.13772, 0.31868]
      snapped: [true, true, false, false, false]   # on the fuselage section curve; an edge between two snapped
                                                   # vertices follows the curve and is not editable
      edges: [straight, straight, straight, straight, straight]  # edge i joins vertex i to i+1: straight or curved
      handles: [null, null, null, null, null]  # curved edges: [[du, dv], [du, dv]] tangent offsets from its two vertices
      continuity: [corner, corner, corner, corner, corner]       # per vertex: corner, smooth (G1) or symmetric
    # more sections: add entries with 0 < s < 1; each keeps its own shape but is sized by the area law A(s).
    # The engine face (s = 1) is a fixed circle and is not listed.
  junction:
    point: [4.0, 0.0, 0.2]         # [x, 0, z] where the branches merge (drag it in the SIDE / TOP tabs)
    splitter_length: 0.0           # m, the branch negatives stay apart (a wall of wall_thickness on y = 0) this far
                                   # into the trunk; 0 = they merge at the junction plane
    overlap: 0.02                  # m, each branch negative reaches this far past the junction plane and the trunk
                                   # negative starts this far before it (inside the duct, for clean booleans)
  centreline:                      # cubic Bezier centrelines; null = default (handle_fraction x chord length)
    junction_pitch_deg: null       # tangent direction at the junction in the XZ plane (0 = +X, + up)
    start_handle: null             # m, handle at the inlet section centroid, along the inward plane normal
    junction_in_handle: null       # m, branch side of the junction
    junction_out_handle: null      # m, trunk side of the junction (collinear with the in-handle: G1)
    end_handle: null               # m, handle at the engine face, along the engine axis
    handle_fraction: 0.3333        # default handle length / chord length
  area_points:                     # area law A(s), PCHIP through these; null = derived from area_law below
    junction_area: null            # m^2 at the junction (trunk start); each branch ends with half of it
    branch: null                   # interior control points [[s, area], ...], s = local arc length 0..1
    trunk: null
  wall_thickness: 0.004            # m, the positive body is the inner section offset outward by this
  lip_extension: 0.05              # m, the negative starts this far upstream of the opening plane
  lip_mode: blunt                  # lip shape of the positive at the opening ("blunt" for now)
  engine_face:
    centre: [5.0, 0.0, 0.0]        # [x, 0, z]
    normal: [1.0, 0.0, 0.0]        # default +X
  n_stations_branch: 12
  n_stations_trunk: 12
  n_section_points: 64             # points per resampled cross-section
  area_law: cosine                 # "linear" or "cosine"

# ---- Phase 3: checks and visualisation ----------------------------------
checks:
  min_clearance: 0.02              # m, minimum wall clearance to the fuselage skin
  max_diffuser_half_angle_deg: 6.0
  lip_length: 0.15                 # m, the positive may leave the skin only this far aft of the opening
